apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hw6-orders-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HghaVlad/hw6
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: hw6-orders-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
