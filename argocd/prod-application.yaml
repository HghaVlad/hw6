apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hw6-orders-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HghaVlad/example
    targetRevision: main
    path: k8s-hw6/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: hw6-orders-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
