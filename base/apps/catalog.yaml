apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: nginx:1.28.0-alpine
          envFrom:
            - configMapRef:
                name: catalog-settings
          env:
            # Штатный entrypoint nginx создаёт index.html из шаблона и env.
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /usr/share/nginx/html
            - name: NGINX_ENVSUBST_FILTER
              value: "^(PAGE_TITLE|PAGE_MESSAGE|APP_ENV)$"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: page-template
              mountPath: /etc/nginx/templates/index.html.template
              subPath: index.html.template
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: stub-content
        - name: page-template
          configMap:
            name: catalog-page
