apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - apps/catalog.yaml
  - apps/orders.yaml
  - apps/notifications.yaml
configMapGenerator:
  - name: stub-content
    files:
      - nginx/default.conf
  - name: catalog-page
    files:
      - index.html.template=apps/catalog.html.template
  - name: orders-page
    files:
      - index.html.template=apps/orders.html.template
  - name: notifications-page
    files:
      - index.html.template=apps/notifications.html.template
