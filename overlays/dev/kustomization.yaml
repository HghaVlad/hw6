apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hw6-orders-dev
resources:
  - ../../base
  - namespace.yaml
# Версия меняется отдельно для каждого окружения.
images:
  - name: nginx
    newTag: "1.28.0-alpine"

# Меняем только текст: HTML-шаблоны остаются в base/apps.
# Хеш ConfigMap вызывает rollout при изменении значений.
configMapGenerator:
  - name: catalog-settings
    literals:
      - APP_ENV=dev
      - PAGE_TITLE=Товраы товарар
      - PAGE_MESSAGE=Тестовая страница. Здесь будет список товаров.
  - name: orders-settings
    literals:
      - APP_ENV=dev
      - PAGE_TITLE=Заказы
      - PAGE_MESSAGE=Тестовая страница. Здесь будут ваши заказы.
  - name: notifications-settings
    literals:
      - APP_ENV=dev
      - PAGE_TITLE=Уведомления
      - PAGE_MESSAGE=Тестовая страница. Здесь будут уведомления о заказах.
